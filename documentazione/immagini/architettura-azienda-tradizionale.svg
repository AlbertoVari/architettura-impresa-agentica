<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="titolo descrizione">
  <title id="titolo">Architettura dell'azienda tradizionale</title>
  <desc id="descrizione">Sei strati sovrapposti: dati, SQL, ERP, esperienza utente, processi e modello di business. Il valore economico sale dal basso verso l'alto e l'utente incontra il maggiore attrito negli strati di esperienza e processo.</desc>
  <defs>
    <linearGradient id="sfondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
    <filter id="ombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="freccia-blu" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1D4ED8"/>
    </marker>
    <marker id="freccia-rossa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="1600" height="1100" fill="url(#sfondo)"/>
  <circle cx="1450" cy="105" r="180" fill="#DBEAFE" opacity="0.45"/>
  <circle cx="90" cy="1020" r="220" fill="#BFDBFE" opacity="0.30"/>

  <text x="110" y="92" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700">Architettura dell'azienda tradizionale</text>
  <text x="110" y="137" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="24">Il valore economico si genera dal basso verso l'alto</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="330" y="215" width="900" height="112" rx="22" fill="#1E3A8A"/>
    <text x="375" y="260" fill="#FFFFFF" font-size="20" font-weight="700" letter-spacing="1.5">6 · STRATEGIA</text>
    <text x="375" y="299" fill="#FFFFFF" font-size="29" font-weight="700">Modello di business</text>
    <text x="1190" y="260" text-anchor="end" fill="#DBEAFE" font-size="17">Valore · Ricavi · Margini</text>

    <rect x="330" y="342" width="900" height="112" rx="22" fill="#1D4ED8"/>
    <text x="375" y="387" fill="#FFFFFF" font-size="20" font-weight="700" letter-spacing="1.5">5 · OPERATIVITÀ</text>
    <text x="375" y="426" fill="#FFFFFF" font-size="29" font-weight="700">Processi</text>
    <text x="1190" y="387" text-anchor="end" fill="#DBEAFE" font-size="17">Procedure · Controlli · Passaggi</text>

    <rect x="330" y="469" width="900" height="112" rx="22" fill="#2563EB"/>
    <text x="375" y="514" fill="#FFFFFF" font-size="20" font-weight="700" letter-spacing="1.5">4 · INTERAZIONE</text>
    <text x="375" y="553" fill="#FFFFFF" font-size="29" font-weight="700">Esperienza utente</text>
    <text x="1190" y="514" text-anchor="end" fill="#DBEAFE" font-size="17">Maschere ERP · Menu · Report</text>

    <rect x="330" y="596" width="900" height="112" rx="22" fill="#60A5FA"/>
    <text x="375" y="641" fill="#0F172A" font-size="20" font-weight="700" letter-spacing="1.5">3 · SISTEMI</text>
    <text x="375" y="680" fill="#0F172A" font-size="29" font-weight="700">ERP</text>
    <text x="1190" y="641" text-anchor="end" fill="#172554" font-size="17">Sistema transazionale centrale</text>

    <rect x="330" y="723" width="900" height="112" rx="22" fill="#93C5FD"/>
    <text x="375" y="768" fill="#0F172A" font-size="20" font-weight="700" letter-spacing="1.5">2 · ACCESSO</text>
    <text x="375" y="807" fill="#0F172A" font-size="29" font-weight="700">SQL</text>
    <text x="1190" y="768" text-anchor="end" fill="#172554" font-size="17">Query · Viste · Report preconfigurati</text>

    <rect x="330" y="850" width="900" height="112" rx="22" fill="#DBEAFE"/>
    <text x="375" y="895" fill="#0F172A" font-size="20" font-weight="700" letter-spacing="1.5">1 · FONDAZIONE</text>
    <text x="375" y="934" fill="#0F172A" font-size="29" font-weight="700">Dati</text>
    <text x="1190" y="895" text-anchor="end" fill="#172554" font-size="17">Clienti · Ordini · Fatture · Magazzino</text>
  </g>

  <line x1="232" y1="935" x2="232" y2="245" stroke="#1D4ED8" stroke-width="8" stroke-linecap="round" marker-end="url(#freccia-blu)"/>
  <g transform="translate(168 710) rotate(-90)">
    <text fill="#1D4ED8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1">VALORE ECONOMICO</text>
  </g>

  <path d="M1268 359 L1300 359 L1300 566 L1268 566" fill="none" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
  <rect x="1332" y="377" width="218" height="172" rx="22" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
  <circle cx="1441" cy="418" r="22" fill="#FEE2E2"/>
  <circle cx="1441" cy="411" r="7" fill="#DC2626"/>
  <path d="M1428 437 Q1441 424 1454 437" fill="none" stroke="#DC2626" stroke-width="5" stroke-linecap="round"/>
  <text x="1441" y="474" text-anchor="middle" fill="#991B1B" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Maggiore attrito</text>
  <text x="1441" y="505" text-anchor="middle" fill="#7F1D1D" font-family="Inter, Arial, sans-serif" font-size="16">L'utente deve imparare</text>
  <text x="1441" y="529" text-anchor="middle" fill="#7F1D1D" font-family="Inter, Arial, sans-serif" font-size="16">schermate e procedure</text>
  <line x1="1332" y1="463" x2="1304" y2="463" stroke="#DC2626" stroke-width="4" marker-end="url(#freccia-rossa)"/>

  <text x="1248" y="642" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">INFRASTRUTTURA TECNICA</text>
  <path d="M1268 614 L1300 614 L1300 948 L1268 948" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>

  <rect x="330" y="1002" width="900" height="52" rx="16" fill="#FFFFFF" opacity="0.92"/>
  <text x="780" y="1036" text-anchor="middle" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="18">Il sistema espone schermate; l'utente traduce il bisogno aziendale in operazioni tecniche.</text>
</svg>
