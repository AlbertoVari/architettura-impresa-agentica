<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="titolo descrizione">
  <title id="titolo">Architettura dell'azienda agentica</title>
  <desc id="descrizione">Sei strati trasformati dagli agenti AI: prodotti dati e conoscenza, livello semantico e strumenti, ERP come sistema di registrazione e azione, esperienza per intento, processi agentici e modello di business adattivo. Obiettivi e regole scendono dall'alto, valore ed evidenze salgono dal basso. Governance, sicurezza, audit e valutazioni attraversano tutti i livelli.</desc>
  <defs>
    <linearGradient id="sfondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="agente" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="ombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#312E81" flood-opacity="0.12"/>
    </filter>
    <marker id="freccia-su" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#059669"/>
    </marker>
    <marker id="freccia-giu" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7C3AED"/>
    </marker>
    <marker id="freccia-ai" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="1600" height="1100" fill="url(#sfondo)"/>
  <circle cx="1480" cy="80" r="200" fill="#EDE9FE" opacity="0.60"/>
  <circle cx="80" cy="1030" r="230" fill="#D1FAE5" opacity="0.45"/>

  <text x="90" y="84" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700">Architettura dell'azienda agentica</text>
  <text x="90" y="129" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="24">Gli agenti AI collegano obiettivi, processi, sistemi e dati</text>

  <line x1="105" y1="250" x2="105" y2="932" stroke="#7C3AED" stroke-width="7" stroke-linecap="round" marker-end="url(#freccia-giu)"/>
  <g transform="translate(66 610) rotate(-90)">
    <text fill="#7C3AED" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1">OBIETTIVI · REGOLE · LIMITI</text>
  </g>
  <line x1="190" y1="932" x2="190" y2="250" stroke="#059669" stroke-width="7" stroke-linecap="round" marker-end="url(#freccia-su)"/>
  <g transform="translate(228 685) rotate(-90)">
    <text fill="#047857" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1">VALORE · EVIDENZE · FEEDBACK</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="285" y="205" width="835" height="112" rx="22" fill="#312E81"/>
    <text x="325" y="247" fill="#DDD6FE" font-size="18" font-weight="700" letter-spacing="1.4">6 · STRATEGIA</text>
    <text x="325" y="287" fill="#FFFFFF" font-size="28" font-weight="700">Modello di business adattivo</text>
    <text x="1080" y="247" text-anchor="end" fill="#EDE9FE" font-size="16">Risultati · Nuovi servizi · Cicli di feedback</text>

    <rect x="285" y="332" width="835" height="112" rx="22" fill="#4338CA"/>
    <text x="325" y="374" fill="#E0E7FF" font-size="18" font-weight="700" letter-spacing="1.4">5 · OPERATIVITÀ</text>
    <text x="325" y="414" fill="#FFFFFF" font-size="28" font-weight="700">Processi agentici</text>
    <text x="1080" y="374" text-anchor="end" fill="#E0E7FF" font-size="16">Orchestrazione · Eccezioni · Approvazioni</text>

    <rect x="285" y="459" width="835" height="112" rx="22" fill="#4F46E5"/>
    <text x="325" y="501" fill="#E0E7FF" font-size="18" font-weight="700" letter-spacing="1.4">4 · INTERAZIONE</text>
    <text x="325" y="541" fill="#FFFFFF" font-size="28" font-weight="700">Esperienza per intento</text>
    <text x="1080" y="501" text-anchor="end" fill="#E0E7FF" font-size="16">Linguaggio naturale · Evidenze · Azioni</text>

    <rect x="285" y="586" width="835" height="112" rx="22" fill="#818CF8"/>
    <text x="325" y="628" fill="#1E1B4B" font-size="18" font-weight="700" letter-spacing="1.4">3 · SISTEMI</text>
    <text x="325" y="668" fill="#1E1B4B" font-size="28" font-weight="700">ERP: registrazione e azione</text>
    <text x="1080" y="628" text-anchor="end" fill="#1E1B4B" font-size="16">Interfacce controllate · Transazioni · Tracciabilità</text>

    <rect x="285" y="713" width="835" height="112" rx="22" fill="#C4B5FD"/>
    <text x="325" y="755" fill="#1E1B4B" font-size="18" font-weight="700" letter-spacing="1.4">2 · COMPRENSIONE E AZIONE</text>
    <text x="325" y="795" fill="#1E1B4B" font-size="28" font-weight="700">Livello semantico e strumenti</text>
    <text x="1080" y="755" text-anchor="end" fill="#312E81" font-size="16">Metriche · Contratti · Strumenti · Regole</text>

    <rect x="285" y="840" width="835" height="112" rx="22" fill="#EDE9FE"/>
    <text x="325" y="882" fill="#1E1B4B" font-size="18" font-weight="700" letter-spacing="1.4">1 · FONDAZIONE</text>
    <text x="325" y="922" fill="#1E1B4B" font-size="28" font-weight="700">Prodotti dati e conoscenza</text>
    <text x="1080" y="882" text-anchor="end" fill="#312E81" font-size="16">Dati governati · Catalogo · Eventi · Contesto</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="1200" y="177" width="190" height="54" rx="27" fill="url(#agente)"/>
    <text x="1295" y="212" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="700" letter-spacing="1.5">AGENTI AI</text>
    <line x1="1295" y1="232" x2="1295" y2="924" stroke="#7C3AED" stroke-width="6" stroke-linecap="round" opacity="0.55"/>

    <g>
      <circle cx="1295" cy="261" r="30" fill="url(#agente)"/>
      <text x="1295" y="269" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">AI</text>
      <line x1="1262" y1="261" x2="1130" y2="261" stroke="#7C3AED" stroke-width="4" marker-end="url(#freccia-ai)"/>
    </g>
    <g>
      <circle cx="1295" cy="388" r="30" fill="url(#agente)"/>
      <text x="1295" y="396" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">AI</text>
      <line x1="1262" y1="388" x2="1130" y2="388" stroke="#7C3AED" stroke-width="4" marker-end="url(#freccia-ai)"/>
    </g>
    <g>
      <circle cx="1295" cy="515" r="30" fill="url(#agente)"/>
      <text x="1295" y="523" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">AI</text>
      <line x1="1262" y1="515" x2="1130" y2="515" stroke="#7C3AED" stroke-width="4" marker-end="url(#freccia-ai)"/>
    </g>
    <g>
      <circle cx="1295" cy="642" r="30" fill="url(#agente)"/>
      <text x="1295" y="650" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">AI</text>
      <line x1="1262" y1="642" x2="1130" y2="642" stroke="#7C3AED" stroke-width="4" marker-end="url(#freccia-ai)"/>
    </g>
    <g>
      <circle cx="1295" cy="769" r="30" fill="url(#agente)"/>
      <text x="1295" y="777" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">AI</text>
      <line x1="1262" y1="769" x2="1130" y2="769" stroke="#7C3AED" stroke-width="4" marker-end="url(#freccia-ai)"/>
    </g>
    <g>
      <circle cx="1295" cy="896" r="30" fill="url(#agente)"/>
      <text x="1295" y="904" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">AI</text>
      <line x1="1262" y1="896" x2="1130" y2="896" stroke="#7C3AED" stroke-width="4" marker-end="url(#freccia-ai)"/>
    </g>

    <rect x="1405" y="257" width="150" height="596" rx="28" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="3"/>
    <circle cx="1480" cy="358" r="24" fill="#EDE9FE"/>
    <path d="M1480 342 L1496 350 L1492 371 L1480 380 L1468 371 L1464 350 Z" fill="none" stroke="#6D28D9" stroke-width="4" stroke-linejoin="round"/>
    <text x="1480" y="430" text-anchor="middle" fill="#4C1D95" font-size="17" font-weight="700">GOVERNANCE</text>
    <line x1="1436" y1="461" x2="1524" y2="461" stroke="#DDD6FE" stroke-width="2"/>
    <text x="1480" y="506" text-anchor="middle" fill="#4C1D95" font-size="17" font-weight="700">SICUREZZA</text>
    <line x1="1436" y1="537" x2="1524" y2="537" stroke="#DDD6FE" stroke-width="2"/>
    <text x="1480" y="582" text-anchor="middle" fill="#4C1D95" font-size="17" font-weight="700">AUDIT</text>
    <line x1="1436" y1="613" x2="1524" y2="613" stroke="#DDD6FE" stroke-width="2"/>
    <text x="1480" y="658" text-anchor="middle" fill="#4C1D95" font-size="16" font-weight="700">VALUTAZIONI</text>
    <text x="1480" y="706" text-anchor="middle" fill="#6B7280" font-size="15">Capacità</text>
    <text x="1480" y="730" text-anchor="middle" fill="#6B7280" font-size="15">trasversali</text>

    <rect x="1170" y="548" width="215" height="48" rx="24" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/>
    <text x="1278" y="579" text-anchor="middle" fill="#065F46" font-size="16" font-weight="700">Supervisione umana</text>
  </g>

  <rect x="285" y="997" width="1105" height="54" rx="17" fill="#FFFFFF" opacity="0.94"/>
  <text x="837" y="1032" text-anchor="middle" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="18">L'agente comprende l'intento, usa strumenti autorizzati, propone azioni e lascia all'organizzazione il controllo.</text>
</svg>
